
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <meta
        name="description"
        content="Un viaje por los inventos, los hechos y las ideas que están cambiando el mundo."
    >

    <title>Siglo XXI</title>
    <link rel="stylesheet" href="css/indexcss.css">
    <link rel="icon" href="img/icon.png" type="image/png">
</head>

<body>

  <main class="contenedor_video">

    <!-- Fondo original, conservado para compatibilidad con el JS -->
    <video
      autoplay
      muted
      loop
      playsinline
      preload="auto"
      poster="img/poster.jpg"
      class="video_fondo"
      aria-hidden="true"
      tabindex="-1">
      <source src="img/fondo_tierra.mp4" type="video/mp4">
    </video>

    <!-- Oscuridad y profundidad del espacio -->
    <div class="capa_oscura" aria-hidden="true"></div>


    <!-- ASTEROIDES INDEPENDIENTES Y ANIMABLES -->
    <div class="asteroides-fondo" aria-hidden="true">

      <img
        src="img/asteroide_1.png"
        class="asteroide-decorativo asteroide-uno"
        alt=""
        draggable="false">

      <img
        src="img/asteroide_2.png"
        class="asteroide-decorativo asteroide-dos"
        alt=""
        draggable="false">

      <img
        src="img/asteroide_3.png"
        class="asteroide-decorativo asteroide-tres"
        alt=""
        draggable="false">

    </div>
    <!-- FIN DE ASTEROIDES -->


    <!-- ROBOT, ÓRBITA Y CINCO ESFERAS -->
    <section
      class="escena-robot"
      aria-label="Robot y temas del siglo XXI">

      <!-- Órbita luminosa -->
      <div class="orbita-robot" aria-hidden="true"></div>


      <!-- ESFERAS CON LOS LOGOS DEFINITIVOS -->
      <div class="esferas-orbita">

        <!-- Inteligencia artificial -->
        <button
          class="esfera tema-ia"
          type="button"
          data-tema="Inteligencia artificial"
          aria-label="Inteligencia artificial"
          aria-pressed="false">

          <img
            class="logo-esfera"
            src="img/logo_ia.png"
            alt=""
            draggable="false">

          <span class="nombre-tema">Inteligencia artificial</span>
        </button>


        <!-- Exploración espacial -->
        <button
          class="esfera tema-espacio"
          type="button"
          data-tema="Exploración espacial"
          aria-label="Exploración espacial"
          aria-pressed="false">

          <img
            class="logo-esfera"
            src="img/logo_exploracion.png"
            alt=""
            draggable="false">

          <span class="nombre-tema">Exploración espacial</span>
        </button>


        <!-- Medicina y genética -->
        <button
          class="esfera tema-medicina"
          type="button"
          data-tema="Medicina y genética"
          aria-label="Medicina y genética"
          aria-pressed="false">

          <img
            class="logo-esfera"
            src="img/logo_genetica.png"
            alt=""
            draggable="false">

          <span class="nombre-tema">Medicina y genética</span>
        </button>


        <!-- Internet y conectividad -->
        <button
          class="esfera tema-conectividad"
          type="button"
          data-tema="Internet y conectividad"
          aria-label="Internet y conectividad"
          aria-pressed="false">

          <img
            class="logo-esfera"
            src="img/logo_conectividad.png"
            alt=""
            draggable="false">

          <span class="nombre-tema">Internet y conectividad</span>
        </button>


        <!-- Energías renovables -->
        <button
          class="esfera tema-energia"
          type="button"
          data-tema="Energías renovables"
          aria-label="Energías renovables"
          aria-pressed="false">

          <img
            class="logo-esfera"
            src="img/logo_renovables.png"
            alt=""
            draggable="false">

          <span class="nombre-tema">Energías renovables</span>
        </button>

      </div>
      <!-- FIN DE LAS CINCO ESFERAS -->


      <!-- Mensaje del robot -->
      <div class="burbuja-robot">
        ¿Quieres aprender más?
      </div>


      <!-- Robot independiente del fondo -->
      <img
        src="img/robot_saludo_corregido.webp"
        alt="Robot futurista saludando con la mano"
        class="robot-animado"
        draggable="false">

    </section>
    <!-- FIN DE LA ESCENA ESPACIAL -->


    <!-- TEXTO PRINCIPAL -->
    <section
      class="contenido"
      aria-labelledby="titulo-principal">

      <h1 class="titulo1">Bienvenido al</h1>

      <h1 class="titulo2" id="titulo-principal">
        SIGLO <span class="xxi">XXI</span>
      </h1>

      <p class="parrafo primer-parrafo">
        Un viaje por los inventos, los hechos y las ideas
      </p>

      <p class="parrafo">
        que están cambiando el mundo.
      </p>

      <!-- Enlace a la página existente -->
      <a
        class="boton"
        href="html/explorar.html">
        Entrar al siglo XXI →
      </a>

    </section>
    <!-- FIN DEL TEXTO PRINCIPAL -->


    <!-- CRÉDITOS -->
    <p class="nombres">
      Realizado por: Adrián Vargas, Daniel Manios y Ángel Polo
    </p>

  </main>


  <!-- Scripts originales de la portada -->
  <script src="javascript/indexjs.js"></script>
  <script src="javascript/transicion.js"></script>

  <!-- Interacción para seleccionar los temas de las esferas -->
  <script src="javascript/orbita.js"></script>

</body>
</html>
