<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#020713">
  <meta name="color-scheme" content="dark">
  <title>Siglo XXI</title>
  <link rel="icon" href="img/icon.png" type="image/png">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/portada.css">

  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
      }
    }
  </script>
</head>
<body>
  <!-- Portada: 1. Tierra 3D → 2. robot bailando → 3. sala de bienvenida -->
  <main id="portada" class="portada" aria-label="Portada de Siglo XXI">
    <a class="portada__omitir" href="#bienvenida">Omitir introducción</a>

    <!-- PARTE 1: TIERRA 3D -->
    <div class="portada__espacio" data-espacio></div>
    <p class="portada__creditos" data-creditos>Realizado por: Adrián Vargas · Daniel Manios · Ángel Polo</p>

    <!-- PARTE 2: ROBOT BAILANDO SOBRE LA PLATAFORMA -->
    <section class="portada__pista" data-pista aria-label="Escenario futurista con robot">
      <canvas class="portada__baile" data-baile aria-label="Robot bailando sobre una plataforma tecnológica"></canvas>
    </section>

    <div class="portada__mensaje" data-mensaje role="status" aria-live="polite"></div>
    <div class="portada__error" data-error role="alert" hidden></div>

    <button type="button" class="portada__flecha" data-accion="espacio" aria-label="Volver al espacio" title="Volver al espacio" hidden>
      <svg aria-hidden="true" viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </button>

    <div class="portada__sonido" data-sonido hidden>
      <button type="button" class="portada__musica" data-accion="musica" hidden>
        <svg aria-hidden="true" viewBox="0 0 24 24"><path d="M8 5.5v13l10-6.5z" fill="currentColor"/></svg>
        Activar música
      </button>
      <button type="button" class="portada__silencio" data-accion="silencio" aria-pressed="false" aria-label="Silenciar la música" title="Silenciar la música">
        <svg aria-hidden="true" viewBox="0 0 24 24"><path d="M4 9h4l5-4v14l-5-4H4z" fill="currentColor"/><path class="i-onda" d="M16 8.5a5 5 0 0 1 0 7M18.5 6a8.5 8.5 0 0 1 0 12" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/><path class="i-x" d="M16.5 9.5l5 5m0-5l-5 5" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
      </button>
    </div>

    <!-- Globo del robot: frase del meme → introducción → pregunta con dos opciones (javascript/portada.js) -->
    <div class="portada__dialogo" data-dialogo role="dialog" aria-labelledby="dialogo-titulo" aria-modal="false" hidden>
      <p class="portada__dialogo-texto" id="dialogo-titulo" aria-live="polite" data-dialogo-texto>¿Me acompañas a descubrirlos?</p>
      <div class="portada__dialogo-botones" data-dialogo-botones>
        <button type="button" class="portada__btn portada__btn--si" data-accion="continuar">¡Vamos!</button>
        <button type="button" class="portada__btn portada__btn--no" data-accion="espacio" aria-label="Más tarde, volver al espacio">Más tarde</button>
      </div>
    </div>

    <!-- PARTE 3: SALA DE BIENVENIDA -->
    <section class="portada__bienvenida" data-bienvenida aria-label="Bienvenido al siglo XXI">
      <button type="button" class="portada__flecha portada__flecha--bienvenida" data-accion="robot" aria-label="Volver a la escena del robot" title="Volver a la escena del robot">
        <svg aria-hidden="true" viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>
      <div class="portada__bienvenida-contenido">
        <h1 class="sr-only" tabindex="-1" data-titulo-bienvenida>Bienvenido al siglo XXI</h1>
        <p class="sr-only">Un viaje por los inventos, los hechos y las ideas que están cambiando el mundo.</p>
        <img class="portada__holograma" data-holograma data-src="img/siglo_xxi_holograma_transparente.apng" alt="" width="1200" height="500" decoding="async">
        <a class="portada__comenzar" id="comenzarRecorrido" href="html/explorar.html">Comenzar recorrido</a>
      </div>
    </section>

    <audio class="portada__audio" data-audio src="audio/pista_robot.mp3" preload="none" loop></audio>
  </main>

  <noscript>
    <p style="position:fixed;inset:auto 0 40%;text-align:center">Esta portada necesita JavaScript. <a href="html/explorar.html" style="color:#66e6ff">Ir al recorrido</a></p>
  </noscript>

  <script type="module" src="javascript/portada.js"></script>
</body>
</html>
