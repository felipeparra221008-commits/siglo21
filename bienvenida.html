
<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#020713">
  <title>Siglo XXI</title>

  <style>
    * { box-sizing: border-box; }

    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: #020713;
      color: white;
      font-family: Arial, sans-serif;
    }

    button, a { font: inherit; }

    #espacio, #pista {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
    }

    /* PARTE 1: TIERRA */
    #espacio {
      z-index: 1;
      cursor: grab;
      touch-action: none;
      transition: opacity 1.2s ease;
    }

    #espacio:active { cursor: grabbing; }

    #espacio canvas {
      display: block;
      width: 100%;
      height: 100%;
    }

    /* AUTORÍA: INFERIOR Y CENTRADA EN LA ESCENA DE LA TIERRA */
    #creditosPortada {
      position: fixed;
      z-index: 20;
      left: 50%;
      bottom: max(14px, env(safe-area-inset-bottom));
      transform: translateX(-50%);
      width: max-content;
      max-width: calc(100% - 24px);
      margin: 0;
      color: rgba(255, 255, 255, 0.82);
      font-size: clamp(8px, 0.72vw, 11px);
      font-weight: 400;
      line-height: 1.4;
      letter-spacing: 0.01em;
      text-align: center;
      white-space: normal;
      text-shadow: 0 1px 5px rgba(0, 0, 0, 0.9);
      pointer-events: none;
      opacity: 1;
      transition: opacity 0.4s ease;
    }

    #creditosPortada.oculto {
      opacity: 0;
      visibility: hidden;
    }

    #mensaje {
      position: fixed;
      z-index: 30;
      left: 50%;
      bottom: max(24px, env(safe-area-inset-bottom));
      transform: translateX(-50%) translateY(8px);
      width: max-content;
      max-width: 90%;
      padding: 9px 14px;
      border: 1px solid #82caff45;
      border-radius: 24px;
      background: #031326d9;
      color: #d9efff;
      text-align: center;
      font-size: clamp(11px, 1.2vw, 14px);
      line-height: 1.45;
      opacity: 0;
      pointer-events: none;
      transition: opacity .4s ease, transform .4s ease;
      backdrop-filter: blur(8px);
    }

    #mensaje.visible {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }

    /* FLECHA CIRCULAR PARA VOLVER AL ESPACIO */
    #volver {
      position: fixed;
      z-index: 35;
      top: max(14px, env(safe-area-inset-top));
      left: max(14px, env(safe-area-inset-left));
      width: 46px;
      height: 46px;
      padding: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      border: 1px solid #66e6ff;
      border-radius: 50%;
      background: #06152de8;
      box-shadow: 0 0 18px #078bff55;
      color: white;
      font-size: 25px;
      line-height: 1;
      cursor: pointer;
      opacity: 0;
      pointer-events: none;
      transition: opacity .4s ease, background .2s ease, transform .2s ease;
    }

    #volver:hover {
      background: #09254b;
      transform: translateY(-1px);
    }

    #volver.visible {
      opacity: 1;
      pointer-events: auto;
    }

    /* PARTE 2: ROBOT Y PLATAFORMA 3D */
    #pista {
      z-index: 2;
      overflow: hidden;
      opacity: 0;
      visibility: hidden;
      background-color: #020713;
      background-image: url("img/fondo_parte%202.png");
      background-position: center center;
      background-repeat: no-repeat;
      background-size: cover;
      transition: opacity 1s ease, visibility 1s ease;
    }

    #pista.visible {
      opacity: 1;
      visibility: visible;
    }

    /* Se mantienen los estilos preexistentes de las escenas. */
    #escenaBaile {
      position: absolute;
      z-index: 2;
      inset: 0;
      display: block;
      width: 100%;
      height: 100%;
      pointer-events: none;
    }

    #dialogoRobot {
      position: fixed;
      z-index: 12;
      top: clamp(14px, 2.5vh, 30px);
      left: 50%;
      transform: translateX(-50%) translateY(-8px);
      width: max-content;
      max-width: min(360px, calc(100% - 36px));
      padding: 12px 17px;
      border: 1px solid #65e4ffb0;
      border-radius: 22px;
      background: linear-gradient(135deg, #06182be8, #11183ae8);
      box-shadow: 0 0 20px #168cff35, inset 0 0 18px #1bdcff0b;
      color: #e8faff;
      text-align: center;
      font-size: clamp(13px, 1.25vw, 16px);
      line-height: 1.45;
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
      cursor: pointer;
      transition: opacity .4s ease, transform .4s ease, visibility .4s ease;
      backdrop-filter: blur(9px);
    }

    #dialogoRobot::after {
      content: "";
      position: absolute;
      left: 25px;
      bottom: -7px;
      width: 12px;
      height: 12px;
      border-right: 1px solid #65e4ffb0;
      border-bottom: 1px solid #65e4ffb0;
      background: #0b1933;
      transform: rotate(45deg);
    }

    #dialogoRobot.visible {
      opacity: 1;
      visibility: visible;
      pointer-events: auto;
      transform: translateX(-50%) translateY(0);
    }

    #dialogoRobot h2 {
      margin: 0;
      color: #f2fbff;
      font-size: inherit;
      font-weight: 500;
    }

    /* MENSAJES DE ERROR */
    #error {
      position: fixed;
      z-index: 80;
      left: 50%;
      top: 50%;
      transform: translate(-50%, -50%);
      width: min(90%, 420px);
      padding: 15px;
      border: 1px solid #42749b;
      border-radius: 10px;
      background: #09162b;
      color: #eaf7ff;
      font-size: 14px;
      line-height: 1.6;
      text-align: center;
      display: none;
    }

    /* PARTE 3: BIENVENIDA */
    #bienvenida {
      position: fixed;
      z-index: 40;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      background-color: #020713;
      background-position: center;
      background-repeat: no-repeat;
      background-size: cover;
      opacity: 0;
      visibility: hidden;
      transition: opacity .8s ease, visibility .8s ease;
    }

    #bienvenida.visible {
      opacity: 1;
      visibility: visible;
    }

    #bienvenida::after {
      content: "";
      position: absolute;
      inset: 0;
      pointer-events: none;
      background: radial-gradient(
        ellipse at center,
        #02071305 20%,
        #02071335 75%,
        #02071385 100%
      );
    }

    .bienvenida-contenido {
      position: relative;
      z-index: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      width: min(94vw, 1200px);
      gap: clamp(18px, 3vh, 30px);
      padding: 24px;
      text-align: center;
    }

    .titulo-holograma {
      display: block;
      width: min(86vw, 1050px);
      max-height: 58vh;
      height: auto;
      object-fit: contain;
      filter: drop-shadow(0 0 14px #10bfff55);
    }

    #comenzarRecorrido {
      position: relative;
      z-index: 2;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      min-height: 50px;
      padding: 13px 25px;
      border: 1px solid #66e6ff;
      border-radius: 999px;
      background: #06152de8;
      box-shadow: 0 0 18px #078bff55, inset 0 0 15px #05cfff18;
      color: #e9fbff;
      font-size: clamp(12px, 1vw, 15px);
      font-weight: 700;
      letter-spacing: .04em;
      text-decoration: none;
      cursor: pointer;
      transition: transform .25s ease, box-shadow .25s ease;
    }

    #comenzarRecorrido:hover {
      transform: translateY(-2px);
      box-shadow: 0 0 28px #078bff8c, inset 0 0 18px #05cfff25;
    }

    /* FLECHA DE REGRESO EN LA PARTE 3 */
    #volverRobot {
      position: fixed;
      z-index: 60;
      top: max(14px, env(safe-area-inset-top));
      left: max(14px, env(safe-area-inset-left));
      width: 46px;
      height: 46px;
      padding: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      border: 1px solid #66e6ff;
      border-radius: 50%;
      background: #06152de8;
      box-shadow: 0 0 18px #078bff55;
      color: white;
      font-size: 25px;
      line-height: 1;
      cursor: pointer;
      transition: background .2s ease, transform .2s ease;
    }

    #volverRobot:hover {
      background: #09254b;
      transform: translateY(-1px);
    }

    #activarMusica {
      position: fixed;
      z-index: 25;
      right: max(16px, env(safe-area-inset-right));
      bottom: max(20px, env(safe-area-inset-bottom));
      padding: 12px 16px;
      border: 1px solid #7edfff88;
      border-radius: 24px;
      background: #07162fee;
      color: white;
      cursor: pointer;
    }

    #activarMusica[hidden] {
      display: none;
    }

    /* CELULARES */
    @media (max-width: 600px) {
      #pista {
        background-position: center center;
        background-size: cover;
      }

      #volver {
        top: max(10px, env(safe-area-inset-top));
        left: max(10px, env(safe-area-inset-left));
        width: 42px;
        height: 42px;
      }

      #dialogoRobot {
        top: max(16px, env(safe-area-inset-top));
        max-width: min(300px, calc(100% - 36px));
        padding: 10px 14px;
        font-size: 13px;
      }

      .bienvenida-contenido {
        width: 100%;
        gap: 22px;
        padding: 20px 12px;
      }

      .titulo-holograma {
        width: 96vw;
        max-height: 42vh;
      }

      #comenzarRecorrido {
        min-height: 48px;
        padding: 12px 19px;
        font-size: 12px;
      }

      #volverRobot {
        top: max(10px, env(safe-area-inset-top));
        left: max(10px, env(safe-area-inset-left));
        width: 42px;
        height: 42px;
      }

      #creditosPortada {
        bottom: max(12px, env(safe-area-inset-bottom));
        max-width: calc(100% - 28px);
        font-size: 9px;
      }
    }

    /* TELEVISORES Y PANTALLAS GRANDES */
    @media (min-width: 1600px) {
      .bienvenida-contenido {
        width: min(90vw, 1450px);
      }

      .titulo-holograma {
        width: min(78vw, 1250px);
      }

      #creditosPortada {
        bottom: 20px;
        font-size: 11px;
      }
    }

    /* Ajustes de encuadre por proporción de pantalla. */
    @media (max-width: 600px) and (orientation: portrait) {
      #mensaje {
        bottom: max(16px, env(safe-area-inset-bottom));
        max-width: 88%;
      }

      #dialogoRobot {
        top: max(12px, env(safe-area-inset-top));
        max-width: min(270px, calc(100% - 28px));
        padding: 8px 11px;
        font-size: clamp(11px, 3.1vw, 13px);
      }

      .bienvenida-contenido {
        width: 100%;
        gap: clamp(12px, 2.5vh, 20px);
        padding: 64px 14px 24px;
      }

      .titulo-holograma {
        width: min(92vw, 620px);
        max-height: 38vh;
      }

      #comenzarRecorrido {
        min-height: 44px;
        padding: 11px 16px;
        font-size: 11px;
      }
    }

    @media (min-width: 601px) and (max-width: 1100px) {
      .titulo-holograma {
        width: min(82vw, 900px);
        max-height: 52vh;
      }

      .bienvenida-contenido {
        width: min(94vw, 1050px);
      }
    }

    @media (min-width: 1600px) {
      #dialogoRobot {
        max-width: 420px;
        font-size: clamp(14px, .9vw, 18px);
      }

      #comenzarRecorrido {
        font-size: clamp(13px, .75vw, 17px);
      }
    }

    @media (prefers-reduced-motion: reduce) {
      #mensaje, #espacio, #pista, #volver, #bienvenida, #dialogoRobot {
        transition-duration: .01ms;
      }
    }
  </style>
</head>

<body>
  <!-- PARTE 1: TIERRA 3D -->
  <main id="espacio" aria-label="Tierra 3D interactiva"></main>

  <!-- CRÉDITOS DE LA PORTADA -->
  <p id="creditosPortada">
    Realizado por: Adrián Vargas - Daniel Manios - Ángel Polo
  </p>

  <!-- PARTE 2: FONDO, ROBOT Y PLATAFORMA 3D -->
  <section id="pista" aria-label="Escenario futurista con robot">
    <canvas id="escenaBaile" aria-label="Robot y plataforma 3D"></canvas>
  </section>

  <div id="mensaje" role="status" aria-live="polite"></div>

  <button id="volver"
          type="button"
          aria-label="Volver al espacio"
          title="Volver al espacio">←</button>

  <div id="error" role="alert"></div>

  <audio id="musicaRobot"
         src="audio/pista_robot.mp3"
         loop
         preload="auto"></audio>

  <button id="activarMusica" type="button" hidden>
    ▶ Activar música
  </button>

  <button id="dialogoRobot"
          type="button"
          aria-label="Continuar a la bienvenida"
          aria-controls="bienvenida">
    <h2>Hey, explorador… ¿quieres aprender más?</h2>
  </button>

  <!-- PARTE 3: BIENVENIDA -->
  <section id="bienvenida" aria-label="Bienvenido al siglo XXI">
    <button id="volverRobot"
            type="button"
            aria-label="Volver a la escena del robot"
            title="Volver a la escena del robot">←</button>

    <div class="bienvenida-contenido">
      <img
        class="titulo-holograma"
        src="img/siglo_xxi_holograma_transparente.apng"
        alt="Bienvenido al siglo XXI. Un viaje por los inventos, los hechos y las ideas que están cambiando el mundo."
      >

      <a id="comenzarRecorrido" href="html/explorar.html">
        COMENZAR RECORRIDO <span aria-hidden="true">→</span>
      </a>
    </div>
  </section>

  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
      }
    }
  </script>

  <script type="module">
    import * as THREE from "three";
    import { GLTFLoader } from "three/addons/loaders/GLTFLoader.js";

    const contenedor = document.getElementById("espacio");
    const mensaje = document.getElementById("mensaje");
    const botonVolver = document.getElementById("volver");
    const pista = document.getElementById("pista");
    const error = document.getElementById("error");
    const musicaRobot = document.getElementById("musicaRobot");
    const activarMusica = document.getElementById("activarMusica");
    const dialogoRobot = document.getElementById("dialogoRobot");
    const bienvenida = document.getElementById("bienvenida");
    const tituloHolograma = document.querySelector(".titulo-holograma");
    const volverRobot = document.getElementById("volverRobot");
    const creditosPortada = document.getElementById("creditosPortada");

    let baileIniciado = false;
    let duracionBaile = 1;
    let mezcladorRobot = null;
    const relojBaile = new THREE.Clock();

    function mostrarError(texto) {
      error.textContent = texto;
      error.style.display = "block";
    }

    function ocultarError() {
      error.style.display = "none";
    }

    function mostrarMensaje(texto) {
      mensaje.textContent = texto;
      mensaje.classList.add("visible");
    }

    function ocultarMensaje() {
      mensaje.classList.remove("visible");
    }

    const cargador = new GLTFLoader();

    /* =====================================================
       PARTE 1: TIERRA
       Carga, rotación, arrastre y transición.
    ===================================================== */

    const escena = new THREE.Scene();
    escena.background = new THREE.Color(0x020713);

    const camara = new THREE.PerspectiveCamera(
      45, innerWidth / innerHeight, 0.1, 2000
    );

    camara.position.z = 5;

    const renderizador = new THREE.WebGLRenderer({
      antialias: true,
      alpha: false
    });

    renderizador.setPixelRatio(Math.min(devicePixelRatio, 2));
    renderizador.setSize(innerWidth, innerHeight);
    renderizador.outputColorSpace = THREE.SRGBColorSpace;
    renderizador.toneMapping = THREE.ACESFilmicToneMapping;
    renderizador.toneMappingExposure = 1.1;
    contenedor.appendChild(renderizador.domElement);

    escena.add(new THREE.AmbientLight(0xffffff, 2));

    const luzPrincipal = new THREE.DirectionalLight(0xffffff, 2.7);
    luzPrincipal.position.set(5, 3, 6);
    escena.add(luzPrincipal);

    const luzAzul = new THREE.PointLight(0x168cff, 25, 30);
    luzAzul.position.set(-5, -2, -2);
    escena.add(luzAzul);

    const posiciones = [];

    for (let i = 0; i < 2400; i++) {
      posiciones.push(
        (Math.random() - .5) * 180,
        (Math.random() - .5) * 110,
        -10 - Math.random() * 100
      );
    }

    const geometria = new THREE.BufferGeometry();
    geometria.setAttribute(
      "position",
      new THREE.Float32BufferAttribute(posiciones, 3)
    );

    const estrellas = new THREE.Points(
      geometria,
      new THREE.PointsMaterial({
        color: 0xb9dfff,
        size: .075,
        transparent: true,
        opacity: .85
      })
    );

    escena.add(estrellas);

    const grupoTierra = new THREE.Group();
    escena.add(grupoTierra);

    let tierra = null;
    let cargada = false;
    let estado = "inicio";
    let arrastrando = false;
    let seArrastro = false;
    let inicioX = 0;
    let inicioY = 0;
    let punteroActivo = null;
    let ultimaInteraccion = 0;

    function ajustarCamaraTierra() {
      const ancho = contenedor.clientWidth || innerWidth;
      const alto = contenedor.clientHeight || innerHeight;
      const relacion = ancho / alto;

      camara.aspect = relacion;

      if (relacion < 0.7) {
        camara.fov = 48;
        camara.position.set(0, 0, 5.35);
      } else if (relacion > 2.0) {
        camara.fov = 41;
        camara.position.set(0, 0, 5.45);
      } else {
        camara.fov = 45;
        camara.position.set(0, 0, 5);
      }

      camara.updateProjectionMatrix();
    }

    ajustarCamaraTierra();

    cargador.load(
      "img/Earth_1_12756.glb",
      (modelo) => {
        tierra = modelo.scene;

        const caja = new THREE.Box3().setFromObject(tierra);
        const centro = caja.getCenter(new THREE.Vector3());
        const tamano = caja.getSize(new THREE.Vector3());
        const maximo = Math.max(tamano.x, tamano.y, tamano.z);

        if (!maximo) {
          mostrarError("El modelo de la Tierra no tiene un tamaño válido.");
          return;
        }

        tierra.position.sub(centro);
        tierra.scale.setScalar(2.1 / maximo);
        grupoTierra.add(tierra);
        cargada = true;
        ocultarError();
      },
      undefined,
      (fallo) => {
        console.error(fallo);
        mostrarError(
          "No se pudo cargar la Tierra. Comprueba que exista " +
          "img/Earth_1_12756.glb y abre la página con Live Server."
        );
      }
    );

    /* =====================================================
       PARTE 2: PLATAFORMA Y ROBOT 3D
    ===================================================== */

    const canvasBaile = document.getElementById("escenaBaile");
    const escenaBaile = new THREE.Scene();

    const camaraBaile = new THREE.PerspectiveCamera(
      38, innerWidth / innerHeight, 0.1, 1000
    );

    const renderBaile = new THREE.WebGLRenderer({
      canvas: canvasBaile,
      antialias: true,
      alpha: true,
      powerPreference: "high-performance"
    });

    renderBaile.setPixelRatio(Math.min(devicePixelRatio, 1.5));
    renderBaile.setSize(innerWidth, innerHeight);
    renderBaile.outputColorSpace = THREE.SRGBColorSpace;
    renderBaile.toneMapping = THREE.ACESFilmicToneMapping;
    renderBaile.toneMappingExposure = 1.15;

    escenaBaile.add(
      new THREE.HemisphereLight(0xc9eaff, 0x10102c, 2.2)
    );

    const luzBlancaBaile = new THREE.DirectionalLight(0xffffff, 3);
    luzBlancaBaile.position.set(3, 7, 5);
    escenaBaile.add(luzBlancaBaile);

    /* Luces azules y violetas conservadas. */
    const luzAzulBaile = new THREE.PointLight(0x00bfff, 18, 25);
    luzAzulBaile.position.set(-4, 3, 3);
    escenaBaile.add(luzAzulBaile);

    const luzVioletaBaile = new THREE.PointLight(0x7c3cff, 22, 25);
    luzVioletaBaile.position.set(4, 2, -3);
    escenaBaile.add(luzVioletaBaile);

    const grupoPlataforma = new THREE.Group();
    const grupoRobot = new THREE.Group();

    escenaBaile.add(grupoPlataforma);
    escenaBaile.add(grupoRobot);

    let plataformaCargada = false;
    let robotCargado = false;
    let alturaPlataforma = 0;

    function ajustarCamaraBaile() {
      const ancho = pista.clientWidth || innerWidth;
      const alto = pista.clientHeight || innerHeight;
      const relacion = ancho / alto;

      camaraBaile.aspect = relacion;

      if (relacion < 0.7) {
        camaraBaile.fov = 43;
        camaraBaile.position.set(0, 4.8, 16.5);
      } else if (relacion > 2.0) {
        camaraBaile.fov = 39;
        camaraBaile.position.set(0, 4.1, 13.5);
      } else if (relacion > 1.35) {
        camaraBaile.fov = 42;
        camaraBaile.position.set(0, 4.2, 12.8);
      } else {
        camaraBaile.fov = 44;
        camaraBaile.position.set(0, 4.5, 14.5);
      }

      camaraBaile.lookAt(0, 1.8, 0);
      camaraBaile.updateProjectionMatrix();
    }

    function colocarRobot() {
      if (!plataformaCargada || !robotCargado) return;

      grupoRobot.position.set(0, alturaPlataforma, 0);
      ajustarCamaraBaile();
      ocultarError();
    }

    cargador.load(
      "img/plataforma.glb",
      (modelo) => {
        const plataforma = modelo.scene;
        grupoPlataforma.add(plataforma);
        plataforma.updateMatrixWorld(true);

        const cajaInicial = new THREE.Box3().setFromObject(plataforma);
        const dimensiones = cajaInicial.getSize(new THREE.Vector3());
        const anchoOriginal = Math.max(dimensiones.x, dimensiones.z);

        if (!Number.isFinite(anchoOriginal) || anchoOriginal <= 0) {
          mostrarError("La plataforma no tiene dimensiones válidas.");
          return;
        }

        plataforma.scale.multiplyScalar(13 / anchoOriginal);
        plataforma.updateMatrixWorld(true);

        let caja = new THREE.Box3().setFromObject(plataforma);
        const centro = caja.getCenter(new THREE.Vector3());

        plataforma.position.x -= centro.x;
        plataforma.position.z -= centro.z;
        plataforma.position.y -= caja.min.y;

        plataforma.updateMatrixWorld(true);
        caja = new THREE.Box3().setFromObject(plataforma);

        alturaPlataforma = caja.max.y;
        plataformaCargada = true;
        colocarRobot();
      },
      undefined,
      (fallo) => {
        console.error(fallo);
        mostrarError(
          "No se pudo cargar img/plataforma.glb. " +
          "Comprueba que el archivo esté dentro de img."
        );
      }
    );

    cargador.load(
      "img/archivo_robot.glb",
      (modelo) => {
        const robot = modelo.scene;
        grupoRobot.add(robot);
        robot.updateMatrixWorld(true);

        const cajaInicial = new THREE.Box3().setFromObject(robot);
        const dimensiones = cajaInicial.getSize(new THREE.Vector3());

        if (!Number.isFinite(dimensiones.y) || dimensiones.y <= 0) {
          mostrarError("El robot no tiene dimensiones válidas.");
          return;
        }

        robot.scale.multiplyScalar(4.7 / dimensiones.y);
        robot.updateMatrixWorld(true);

        const cajaRobot = new THREE.Box3().setFromObject(robot);
        const centroRobot = cajaRobot.getCenter(new THREE.Vector3());

        robot.position.x -= centroRobot.x;
        robot.position.z -= centroRobot.z;
        robot.position.y -= cajaRobot.min.y;

        if (modelo.animations && modelo.animations.length) {
          mezcladorRobot = new THREE.AnimationMixer(robot);

          modelo.animations.forEach((clip) => {
            const accion = mezcladorRobot.clipAction(clip);
            accion.enabled = true;
          });
        } else {
          console.warn("El GLB del robot no contiene animaciones.");
        }

        robotCargado = true;
        colocarRobot();
      },
      undefined,
      (fallo) => {
        console.error(fallo);
        mostrarError(
          "No se pudo cargar img/archivo_robot.glb. " +
          "Comprueba que el archivo esté dentro de img."
        );
      }
    );

    function prepararBaileSincronizado() {
      if (!mezcladorRobot) return;

      mezcladorRobot.stopAllAction();

      mezcladorRobot._actions.forEach((accion) => {
        accion.reset();
        accion.enabled = true;
        accion.setEffectiveTimeScale(1);
        accion.setEffectiveWeight(1);
        accion.play();
      });

      const duraciones = mezcladorRobot._actions
        .map((accion) => accion.getClip().duration)
        .filter(Number.isFinite);

      duracionBaile = duraciones.length ? Math.max(...duraciones) : 1;

      mezcladorRobot.setTime(0);
      relojBaile.start();
      baileIniciado = true;
    }

    async function iniciarMusicaRobot() {
      try {
        musicaRobot.currentTime = 0;
        prepararBaileSincronizado();
        await musicaRobot.play();
        activarMusica.hidden = true;
      } catch (falloAudio) {
        console.warn(
          "El navegador requiere activar el audio manualmente.",
          falloAudio
        );

        if (mezcladorRobot) {
          mezcladorRobot.stopAllAction();
          mezcladorRobot._actions.forEach((accion) => accion.stop());
        }

        baileIniciado = false;
        activarMusica.hidden = false;
      }
    }

    activarMusica.addEventListener("click", iniciarMusicaRobot);

    /* Cargar el fondo de la parte 2. */
    (async function cargarFondoParteDos() {
      const rutas = [
        "img/fondo_parte%202.png",
        "img/fondo_parte%202.jpg",
        "img/fondo_parte%202.jpeg",
        "img/fondo_parte%202.webp"
      ];

      for (const ruta of rutas) {
        const imagen = new Image();

        const correcta = await new Promise((resolve) => {
          imagen.onload = () => resolve(true);
          imagen.onerror = () => resolve(false);
          imagen.src = ruta;
        });

        if (correcta) {
          pista.style.backgroundImage = `url("${ruta}")`;
          return;
        }
      }

      console.warn(
        "No se encontró el fondo de la parte 2. " +
        "Comprueba el nombre y la extensión dentro de img."
      );
    })();

    /* =====================================================
       TRANSICIÓN TIERRA -> ROBOT
    ===================================================== */

    function animarTransicion(destino) {
      if (!cargada || !["inicio", "pista"].includes(estado)) return;

      if (destino === "pista") {
        estado = "acercando";
        mostrarMensaje("Acercándonos a la Tierra…");
        botonVolver.classList.remove("visible");

        const zInicial = camara.position.z;
        const escalaInicial = grupoTierra.scale.x;
        const inicio = performance.now();
        const duracion = 3200;

        function paso(tiempo) {
          if (estado !== "acercando") return;

          const p = Math.min((tiempo - inicio) / duracion, 1);
          const suave = p * p * (3 - 2 * p);

          camara.position.z = THREE.MathUtils.lerp(
            zInicial, 2.0, suave
          );

          grupoTierra.scale.setScalar(
            THREE.MathUtils.lerp(
              escalaInicial,
              escalaInicial * 3.8,
              suave
            )
          );

          if (p > .58) {
            pista.classList.add("visible");
            contenedor.style.opacity =
              String(Math.max(0, 1 - (p - .58) / .42));
          }

          if (p < 1) {
            requestAnimationFrame(paso);
          } else {
            estado = "pista";
            contenedor.style.opacity = "0";
            creditosPortada.classList.add("oculto");
            ocultarMensaje();
            botonVolver.classList.add("visible");
            dialogoRobot.classList.add("visible");
            iniciarMusicaRobot();
          }
        }

        requestAnimationFrame(paso);
      }
    }

    function volverAlEspacio() {
      if (estado !== "pista") return;

      estado = "volviendo";
      botonVolver.classList.remove("visible");
      dialogoRobot.classList.remove("visible");
      mostrarMensaje("Regresando al espacio…");

      const inicio = performance.now();
      const duracion = 1800;
      const escalaInicial = grupoTierra.scale.x;
      const zInicial = camara.position.z;

      contenedor.style.opacity = "1";

      function paso(tiempo) {
        if (estado !== "volviendo") return;

        const p = Math.min((tiempo - inicio) / duracion, 1);
        const suave = p * p * (3 - 2 * p);

        grupoTierra.scale.setScalar(
          THREE.MathUtils.lerp(escalaInicial, 1, suave)
        );

        const relacionPantalla = innerWidth / Math.max(innerHeight, 1);
        const zDestino = relacionPantalla < 0.7 ? 5.35 :
          (relacionPantalla > 2.0 ? 5.45 : 5);

        camara.position.z = THREE.MathUtils.lerp(
          zInicial, zDestino, suave
        );

        pista.style.opacity = String(1 - suave);

        if (p < 1) {
          requestAnimationFrame(paso);
        } else {
          grupoTierra.scale.setScalar(1);
          ajustarCamaraTierra();

          pista.classList.remove("visible");
          pista.style.opacity = "";
          pista.style.visibility = "";
          contenedor.style.opacity = "1";

          creditosPortada.classList.remove("oculto");

          musicaRobot.pause();
          musicaRobot.currentTime = 0;

          if (mezcladorRobot) mezcladorRobot.stopAllAction();

          baileIniciado = false;
          activarMusica.hidden = true;
          estado = "inicio";
          ocultarMensaje();
        }
      }

      requestAnimationFrame(paso);
    }

    const lienzo = renderizador.domElement;

    lienzo.addEventListener("pointerdown", (evento) => {
      if (!cargada || estado !== "inicio") return;

      arrastrando = true;
      seArrastro = false;
      punteroActivo = evento.pointerId;
      inicioX = evento.clientX;
      inicioY = evento.clientY;
      ultimaInteraccion = performance.now();

      lienzo.setPointerCapture(evento.pointerId);
    });

    lienzo.addEventListener("pointermove", (evento) => {
      if (
        !arrastrando ||
        evento.pointerId !== punteroActivo ||
        !tierra ||
        estado !== "inicio"
      ) return;

      const dx = evento.clientX - inicioX;
      const dy = evento.clientY - inicioY;

      if (Math.abs(dx) + Math.abs(dy) > 2) seArrastro = true;

      if (seArrastro) {
        tierra.rotation.y += dx * .006;
        tierra.rotation.x += dy * .006;

        tierra.rotation.x = THREE.MathUtils.clamp(
          tierra.rotation.x, -1.25, 1.25
        );
      }

      inicioX = evento.clientX;
      inicioY = evento.clientY;
    });

    lienzo.addEventListener("pointerup", (evento) => {
      if (evento.pointerId !== punteroActivo) return;

      arrastrando = false;
      punteroActivo = null;

      const fueClic = !seArrastro;
      seArrastro = false;

      if (
        fueClic &&
        estado === "inicio" &&
        performance.now() - ultimaInteraccion < 500
      ) {
        animarTransicion("pista");
      }
    });

    lienzo.addEventListener("pointercancel", () => {
      arrastrando = false;
      punteroActivo = null;
      seArrastro = false;
    });

    botonVolver.addEventListener("click", volverAlEspacio);

    /* =====================================================
       PARTE 3: BIENVENIDA Y REGRESO CON LA FLECHA
    ===================================================== */

    function abrirBienvenida() {
      if (estado !== "pista") return;

      estado = "bienvenida";
      musicaRobot.pause();
      musicaRobot.currentTime = 0;

      if (mezcladorRobot) mezcladorRobot.stopAllAction();

      baileIniciado = false;
      activarMusica.hidden = true;
      dialogoRobot.classList.remove("visible");
      botonVolver.classList.remove("visible");
      pista.style.opacity = "0";
      pista.style.visibility = "hidden";

      bienvenida.classList.add("visible");
    }

    dialogoRobot.addEventListener("click", abrirBienvenida);

    function volverAlRobot() {
      if (estado !== "bienvenida") return;

      bienvenida.classList.remove("visible");
      pista.style.visibility = "visible";
      pista.style.opacity = "1";
      pista.classList.add("visible");

      estado = "pista";

      botonVolver.classList.add("visible");
      dialogoRobot.classList.add("visible");

      iniciarMusicaRobot();
    }

    volverRobot.addEventListener("click", volverAlRobot);

    /* Fondo opcional para la parte 3. */
    (async function cargarFondoBienvenida() {
      const rutas = [
        "img/fondo_bienvenida.png",
        "img/fondo_bienvenida.jpg",
        "img/fondo_bienvenida.jpeg",
        "img/fondo_bienvenida.webp",
        "img/cuarto-tecnologico.png",
        "img/cuarto-tecnologico.jpg",
        "img/fondo.png",
        "img/fondo.jpg"
      ];

      for (const ruta of rutas) {
        const imagen = new Image();

        const correcta = await new Promise((resolve) => {
          imagen.onload = () => resolve(true);
          imagen.onerror = () => resolve(false);
          imagen.src = ruta;
        });

        if (correcta) {
          bienvenida.style.backgroundImage = `url("${ruta}")`;
          return;
        }
      }

      console.warn(
        "No se encontró una imagen de fondo para la parte 3. " +
        "La bienvenida utilizará el fondo oscuro."
      );
    })();

    tituloHolograma.addEventListener("error", () => {
      console.error(
        "No se encontró img/siglo_xxi_holograma_transparente.apng. " +
        "Comprueba el nombre del archivo."
      );
    });

    window.addEventListener("keydown", (evento) => {
      if (evento.key === "Escape") {
        if (estado === "bienvenida") {
          volverAlRobot();
        } else {
          volverAlEspacio();
        }
      }
    });

    window.addEventListener("resize", () => {
      if (estado === "inicio" || estado === "pista") {
        ajustarCamaraTierra();
      }

      renderizador.setSize(innerWidth, innerHeight);
      renderizador.setPixelRatio(Math.min(devicePixelRatio, 2));

      renderBaile.setSize(
        pista.clientWidth || innerWidth,
        pista.clientHeight || innerHeight
      );

      renderBaile.setPixelRatio(Math.min(devicePixelRatio, 1.5));

      ajustarCamaraBaile();
    });

    function animar() {
      requestAnimationFrame(animar);

      if (tierra && !arrastrando && estado === "inicio") {
        tierra.rotation.y += .0012;
      }

      estrellas.rotation.y += .000025;
      renderizador.render(escena, camara);

      if (mezcladorRobot && baileIniciado) {
        if (!musicaRobot.paused && Number.isFinite(musicaRobot.currentTime)) {
          mezcladorRobot.setTime(
            musicaRobot.currentTime % duracionBaile
          );
        } else {
          mezcladorRobot.update(
            Math.min(relojBaile.getDelta(), .05)
          );
        }
      }

      /* Movimientos originales de las luces azules y violetas. */
      luzAzulBaile.position.x =
        -4 + Math.sin(performance.now() * .0007) * 1.5;

      luzVioletaBaile.position.x =
        4 + Math.sin(performance.now() * .0006) * 1.5;

      renderBaile.render(escenaBaile, camaraBaile);
    }

    /* =====================================================
       CAMBIO AÑADIDO: ABRIR DIRECTAMENTE LA TERCERA ESCENA
       cuando la URL termina en #bienvenida.
       ===================================================== */
    if (window.location.hash === "#bienvenida") {
      estado = "bienvenida";

      // Ocultar la Tierra y los créditos de la portada.
      contenedor.style.opacity = "0";
      creditosPortada.classList.add("oculto");

      // Mantener oculta la escena del robot.
      pista.classList.remove("visible");
      pista.style.opacity = "0";
      pista.style.visibility = "hidden";

      // Ocultar los controles de las escenas anteriores.
      botonVolver.classList.remove("visible");
      dialogoRobot.classList.remove("visible");

      // Mostrar directamente la tercera escena.
      bienvenida.classList.add("visible");
    }

    ajustarCamaraBaile();
    animar();
  </script>
</body>
</html>
