<body>

    <a href="explorar.html" aria-label="Ir a la página principal">
      <img src="../img/logo.png" alt="Logo SIGLO XXI" class="logo">

    <h1 class="titulo1">Actividad</h1>
    <p class="titulo2">Cinco preguntas sobre el siglo XXI.</p>

    <div class="tarjeta_contenedor">
        <div class="tarjeta">
            <div class="quiz_juego" id="quiz_juego">
                <div class="quiz_cabecera">
                    <p class="quiz_contador" id="quiz_contador"></p>
                    <div class="quiz_barra"><div class="quiz_progreso" id="quiz_progreso"></div></div>
                </div>
                <p class="quiz_pregunta" id="quiz_pregunta"></p>
                <div class="quiz_opciones" id="quiz_opciones"></div>
                <p class="quiz_feedback" id="quiz_feedback" aria-live="polite"></p>
                <button class="boton quiz_boton" id="quiz_siguiente" hidden>Siguiente pregunta →</button>
            </div>

            <div class="quiz_resultado oculto" id="quiz_resultado">
                <p class="quiz_puntaje" id="quiz_puntaje"></p>
                <p class="quiz_mensaje" id="quiz_mensaje"></p>
                <button class="boton quiz_boton" id="quiz_reiniciar">Jugar de nuevo</button>
            </div>
        </div>
    </div>

    <div class="frase_contenedor">
        <video autoplay loop muted playsinline class="video_fondo">
            <source src="../img/machine.mp4" type="video/mp4">
        </video>
        <div class="contenido_frase">
            <p class="texto1_frase">"El progreso se logra mediante la mejora de las personas, no por la mejora de las maquinas"</p>
            <p class="texto2_frase">- Adrian Tchaikovsky</p>
        </div>
    </div>

    <p class="texto3">Gracias!!</p>
    <div class="boton_contenedor">
        <a href="explorar.html"><button class="boton">Volver al menú</button></a>
    </div>
    <p class="nombres">Hecho por: Adrian Vargas - Daniel Manios - Angel Polo</p>
